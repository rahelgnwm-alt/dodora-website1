@if (visible()) {
  <div class="pre" aria-hidden="true">
    <svg class="pre-defs" width="0" height="0" focusable="false">
      <defs>
        <clipPath id="pre-clip" clipPathUnits="objectBoundingBox"><path #clip d="M0 0H1V1H0Z" /></clipPath>
      </defs>
    </svg>
    <div class="pre-layer" #layer>
      <span class="pre-orb o1"></span>
      <span class="pre-orb o2"></span>
      <span class="pre-orb o3"></span>
      <span class="pre-orb o4"></span>
      <span class="pre-circle" #circle></span>
      <span class="pre-logo"><span class="pre-logo-i" #logo></span></span>
    </div>
  </div>
}
