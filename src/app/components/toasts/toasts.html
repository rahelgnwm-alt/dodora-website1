<div class="toast-host" role="region" aria-label="Notifikasi">
  @for (t of toasts.toasts(); track t.id) {
    <div class="toast" [class.toast--error]="t.kind === 'error'" [attr.role]="t.kind === 'error' ? 'alert' : 'status'">
      <app-icon [name]="t.kind === 'error' ? 'alert' : 'check'" [size]="18" />
      <span>{{ t.text }}</span>
      <button type="button" class="x" (click)="toasts.dismiss(t.id)" aria-label="Tutup notifikasi"><app-icon name="close" [size]="16" /></button>
    </div>
  }
</div>
