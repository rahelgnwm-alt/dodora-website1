<article class="pc" dCardHover [class.is-added]="added()" [class.pc--lg]="size() === 'lg'">
  <a
    class="pc-media"
    [routerLink]="['/produk', product().handle]"
    (click)="markShared(media)"
    tabindex="-1"
    aria-hidden="true"
  >
    <span class="pc-img" #media>
      <app-pimg
        [src]="product().images[0]"
        [alt]="''"
        [eager]="eager()"
        [sizes]="size() === 'lg' ? '(min-width: 900px) 34vw, 86vw' : '(min-width: 900px) 24vw, 46vw'"
      />
    </span>
    @if (product().category === 'bundle') {
      <span class="pc-badge">Bundling</span>
    }
  </a>
  <div class="pc-body">
    <span class="pc-cat">{{ cat() }}</span>
    <h3 class="pc-title">
      <a [routerLink]="['/produk', product().handle]" (click)="markShared(media)">{{ product().name }}</a>
    </h3>
    <p class="pc-tag">{{ product().tagline }}</p>
    <div class="pc-foot">
      <p class="pc-price">
        @if (product().variants.length > 1) {
          <small>Mulai</small>
        }
        <strong>{{ from() | idr }}</strong>
      </p>
      <button
        type="button"
        class="pc-add"
        [disabled]="!variant().available"
        (click)="add()"
        [attr.aria-label]="'Tambah ' + product().name + ' ke keranjang'"
      >
        <span class="pc-add-idle"><app-icon name="plus" [size]="18" [stroke]="2.5" /> Tambah</span>
        <span class="pc-add-done" aria-hidden="true"><app-icon name="check" [size]="18" [stroke]="2.5" /> Ditambahkan</span>
      </button>
    </div>
  </div>
</article>
